<script>
  // Ensure ASSET_BASE exists for both root-hosted and subpath-hosted GitHub Pages
  window.ASSET_BASE = (function(){
    // Hostings like https://USERNAME.github.io/REPO/ use a pathname that begins with '/REPO'
    var match = location.pathname.match(/^\/(.*?)\//);
    if(match && match[1] && match[1] !== ''){
      // If site is hosted in a repo (subpath), return '/repo/' as base
      return '/' + match[1] + '/';
    }
    return './';
  })();
</script>
